# xactor's CI: the superproject's reusable workflow, which builds this commit inside a checkout of
# webcpp, on every lane xactor declares, with its page, the lint and the test matrix.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: webcpporg/webcpp/.github/workflows/library.yml@main
    with:
      library: xactor
